sentence=SLH-DSA (FIPS 205) stateless hash-based post-quantum signatures for ESP32. All 12 parameter sets (SHA2/SHAKE, 128/192/256, s/f).
paragraph=Post-quantum digital signature scheme based on the FIPS 205 standard (formerly SPHINCS+), whose security relies only on hash functions. Based on the slhdsa-c implementation (PQCP) with ESP32 hardware RNG support, stack wiping of secret key material and optional SHA hardware acceleration (about 2.5x faster SHA2 parameter sets). Provides key generation, hedged and deterministic signing, HashSLH-DSA pre-hash signing, verification and NVS key storage.
